# GeoTrade — full stack on Render (API + workers + frontend + Postgres + Redis)
# Dashboard: New → Blueprint → select this repo

services:
  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  - type: web
    name: geotrade-api
    runtime: docker
    dockerfilePath: infra/docker/Dockerfile
    dockerContext: .
    dockerCommand: ./scripts/start_api.sh
    plan: starter          # upgrade to standard — ML models need ~1–2 GB RAM
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geotrade-db
          property: connectionString
      - key: DATABASE_SYNC_URL
        fromDatabase:
          name: geotrade-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: geotrade-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: geotrade-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: geotrade-redis
          property: connectionString
      - key: ENV
        value: production
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: FINNHUB_API_KEY
        sync: false
      - key: FINNHUB_API_KEY_2
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # CORS — also allows *.onrender.com via regex in app code
      - key: FRONTEND_URL
        value: https://geotrade-web.onrender.com

  # ── Frontend (Vite SPA via nginx) ─────────────────────────────────────────────
  - type: web
    name: geotrade-web
    runtime: docker
    dockerfilePath: infra/docker/Dockerfile.frontend
    dockerContext: .
    plan: starter
    region: oregon
    # Render exposes service envVars as Docker build-time ARGs (no dockerBuildArgs field)
    envVars:
      - key: VITE_API_URL
        value: https://geotrade-api.onrender.com/api/v1

  # ── Celery Worker ─────────────────────────────────────────────────────────────
  - type: worker
    name: geotrade-worker
    runtime: docker
    dockerfilePath: infra/docker/Dockerfile
    dockerContext: .
    dockerCommand: ./scripts/start_worker.sh
    plan: starter
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geotrade-db
          property: connectionString
      - key: DATABASE_SYNC_URL
        fromDatabase:
          name: geotrade-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: geotrade-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: geotrade-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: geotrade-redis
          property: connectionString
      - key: ENV
        value: production
      - key: APP_ENV
        value: production
      - key: CELERY_CONCURRENCY
        value: "1"
      - key: FINNHUB_API_KEY
        sync: false
      - key: FINNHUB_API_KEY_2
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false

  # ── Celery Beat Scheduler ─────────────────────────────────────────────────────
  - type: worker
    name: geotrade-beat
    runtime: docker
    dockerfilePath: infra/docker/Dockerfile
    dockerContext: .
    dockerCommand: ./scripts/start_beat.sh
    plan: starter
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geotrade-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: geotrade-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: geotrade-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: geotrade-redis
          property: connectionString
      - key: ENV
        value: production
      - key: APP_ENV
        value: production

  # ── Redis ─────────────────────────────────────────────────────────────────────
  - type: redis
    name: geotrade-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: geotrade-db
    databaseName: geotrade
    user: geotrade
    plan: free
